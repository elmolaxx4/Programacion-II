<!DOCTYPE html>
<html lang="es">

<head>

    <title>TechClub | Detalle del producto</title>


    <!-- =====================================================
         IMPORT MAP
         ===================================================== -->

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime"

        import {

            Box,
            Flex,
            Link,
            Heading,

        const h = React.createElement;


        /* =====================================================

        function Header() {

            return h(
                    Box,

                        as: "header",
                        bg: "#0f172a",
                        color: "white",
                        boxShadow: "lg",
                        position: "sticky",
                        top: 0,
                        zIndex: 50
                    },

                h(
                    Flex,
                    {
                        maxW: "7xl",
                        mx: "auto",
                        justify: "space-between",
                        align: "center",
                        px: 5,
                        height: "77px"
                    },

                    h(
                        Link,
                        {
                            href: "index.html",
                            fontSize: "3xl",
                            fontWeight: "extrabold",
                            letterSpacing: "wide",
                            _hover: {
                                color: "blue.300",
                                textDecoration: "none"
                            }
                        },
                        "TechClub"
                    ),

                    h(
                        Flex,
                        {
                            as: "nav",
                            gap: 8,
                            fontWeight: "medium",
                            fontSize: "lg",

                        h(
                            Link,
                            {
                                href: "index.html",
                                _hover: {
                                    color: "blue.300",
                                    textDecoration: "none"
                                }
                            },
                            "Inicio"
                        ),

                            Link,
                            {
                                href: "productos.html",
                                color: "blue.300",
                                _hover: {
                                    color: "blue.200",
                                    textDecoration: "none"
                                }
                            },

                            Link,

                                    color: "blue.300",
                                    textDecoration: "none"
                                }
                            },
                            "Contacto"
                        )
                    )
                )
            );
        }

                            height: "450px",

                       INFORMACIÓN DEL PRODUCTO

                                    sm: 2

                                        color: "gray.900"

                                ),

                                h(
                                    Text,
                                    {
                                        color: "gray.600"

                            h(

                                    bg: "gray.100",
                                    borderRadius: "lg",
                                    p: 4
                                },

                                h(
                                    Text,
                                    {
                                        fontWeight: "600",
                                        color: "gray.900"
                                    },
                                    "Almacenamiento"
                                ),

                                h(
                                    Text,
                                    {
                                        color: "gray.600"
                                    },
                                    "128 GB"
                                )
                            ),

                            h(
                                Box,
                                {
                                    bg: "gray.100",
                                    borderRadius: "lg",
                                    p: 4
                                },

                                h(
                                    Text,
                                    {
                                        fontWeight: "600",
                                        color: "gray.900"
                                    },

                                h(
                                    Text,
                                    {
                                        color: "gray.600"
                                    },
                                    "Sistema de cámara triple"

                            h(
                                Box,

                                    bg: "gray.100",
                                    borderRadius: "lg",
                                    p: 4
                                },

                                h(
                                    Text,
                                    {
                                        fontWeight: "600",
                                        color: "gray.900"

                                    "Batería"
                                ),

                                h(
                                    Text,
                                    {
                                        color: "gray.600"
                                    },
                                    "Hasta un día de uso"
                                )
                            )
                        ),


                        /* =================================================
                           BOTONES
                           ================================================= */

                        h(
                            Flex,

                                direction: {
                                    base: "column",
                                    sm: "row"

                                gap: 4

                            h(

                                    bg: "#0284c7",

                            h(

                            gap: 6,

                                    textDecoration: "none"

                        Text,

                            fontSize: "sm",
                            color: "gray.400",
                            mt: 6
                        },
                        "© 2026 TechClub. Todos los derechos reservados."
                    )
                )
            );
        }


        /* =====================================================
           APP
           ===================================================== */

        function App() {

            return h(
                ChakraProvider,
                null,

                h(
                    Box,
                    {
                        bg: "#e2e8f0",
                        minH: "100vh"
                    },

                    h(Header),

                    h(
                        "main",
                        null,

                        h(DetalleProducto)

                    ),

                    h(Footer)

                )
            );
        }


        /* =====================================================
           RENDER
           ===================================================== */

        const root = createRoot(
            document.getElementById("root")
        );

        root.render(
            h(App)
        );

    </script>
